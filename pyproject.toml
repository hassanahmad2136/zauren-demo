[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-ai-platform"
version = "0.1.0"
description = "Scalable conversational AI platform for retailers"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.4.0",
    "uvicorn>=0.24.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=apps --cov=agents --cov=core --cov-report=html --cov-report=term-missing"
