<!DOCTYPE html>
<html>
<head>
    <title>Test Webhook</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        select, textarea { width: 100%; padding: 8px; }
        button { padding: 10px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Webhook Locally</h1>
    <form method="POST">
        <div class="form-group">
            <label for="event_type">Event Type:</label>
            <select id="event_type" name="event_type">
                <option value="message">Message</option>
                <option value="subscription">Subscription</option>
                <option value="custom">Custom</option>
            </select>
        </div>
        <div class="form-group">
            <label for="payload">JSON Payload:</label>
            <textarea id="payload" name="payload" rows="10">{"message": {"text": "Hello, webhook!"}, "sender": {"id": "user123"}}</textarea>
        </div>
        <button type="submit">Send Test Webhook</button>
    </form>
</body>
</html>
